name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files

      # The same image the consumers' Renovate runs, which is always the latest release
      - name: Validate the Renovate config and presets
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo ghcr.io/renovatebot/renovate:latest \
            renovate-config-validator --strict --no-global .renovaterc.json5 .renovate/*.json5
